name: clage_cook
description: "BYOK multi-model AI conference client for Clage Cook."
publish_to: "none"
version: 0.2.0+6

environment:
  sdk: ^3.12.2

dependencies:
  archive: ^4.0.9
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  file_picker: ^12.0.0-beta.7
  url_launcher: ^6.3.2
  flutter_markdown_plus: ^1.0.12
  flutter_secure_storage: ^10.3.1
  http: ^1.2.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

flutter_launcher_icons:
  image_path: "../icon/icon_color.png"
  android: "launcher_icon"
  min_sdk_android: 23
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "../icon/icon_color.png"
    background_color: "#101119"
    theme_color: "#4966A6"
  windows:
    generate: true
    image_path: "../icon/icon_color.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "../icon/icon_color.png"
